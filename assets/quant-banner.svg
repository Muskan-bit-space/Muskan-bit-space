
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360"
     viewBox="0 0 1200 360">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="55%" stop-color="#091827"/>
      <stop offset="100%" stop-color="#06111c"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40"
            fill="none" stroke="#183047"
            stroke-width="0.7" opacity="0.6"/>
    </pattern>

    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5a8" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#00e5a8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- Horizontal market levels -->
  <g stroke="#1d4960" opacity=".55" stroke-dasharray="4 8">
    <path d="M0 90H1200"/>
    <path d="M0 180H1200"/>
    <path d="M0 270H1200"/>
  </g>

  <!-- Candlestick chart -->
  <g stroke-width="2">
    <g stroke="#00e5a8" fill="#00e5a8">
      <path d="M100 120V215 M145 100V190 M190 130V230
               M280 90V175 M370 110V200 M460 70V160
               M550 95V190 M640 65V155 M730 85V170
               M820 55V145 M910 75V165 M1000 45V140"/>
      <rect x="92" y="155" width="16" height="38"/>
      <rect x="137" y="125" width="16" height="42"/>
      <rect x="182" y="165" width="16" height="35"/>
      <rect x="272" y="120" width="16" height="40"/>
      <rect x="362" y="135" width="16" height="35"/>
      <rect x="452" y="95" width="16" height="42"/>
      <rect x="542" y="125" width="16" height="40"/>
      <rect x="632" y="90" width="16" height="38"/>
      <rect x="722" y="105" width="16" height="42"/>
      <rect x="812" y="75" width="16" height="38"/>
      <rect x="902" y="95" width="16" height="40"/>
      <rect x="992" y="65" width="16" height="42"/>
    </g>
  </g>

  <!-- Moving average -->
  <path d="M0 245 C130 230 190 245 280 205
           S430 220 520 165 S700 185 800 125
           S1000 140 1200 60"
        fill="none" stroke="#00d9ff"
        stroke-width="2" opacity=".8"/>

  <!-- Secondary indicator -->
  <path d="M0 285 C180 275 260 300 400 255
           S650 270 800 225 S1030 245 1200 195"
        fill="none" stroke="#8b7cff"
        stroke-width="1.5" opacity=".65"/>

  <!-- Chart glow -->
  <path d="M0 245 C130 230 190 245 280 205
           S430 220 520 165 S700 185 800 125
           S1000 140 1200 60
           L1200 360 L0 360Z"
        fill="url(#glow)" opacity=".5"/>

  <!-- Terminal labels -->
  <g font-family="monospace" font-size="11"
     fill="#6d91a8" opacity=".8">
    <text x="25" y="25">MARKET DATA / SYSTEMS ENGINEERING</text>
    <text x="1000" y="25">LIVE FEED :: ACTIVE</text>
    <text x="25" y="340">VOLATILITY</text>
    <text x="1050" y="340">QUANT // 001</text>
  </g>
</svg>
